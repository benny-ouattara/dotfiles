font_family      Iosevka Term
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 19

# macOS font override (file ignored silently on Linux where it doesn't exist)
include macos-font.conf

enable_audio_bell no
scrollback_lines 10000
scrollback_pager bash -c "nvim -u NONE -R -M -c 'set nonumber norelativenumber' -c 'nnoremap q :qa!<CR>' -c 'map / ?' -"

hide_window_decorations titlebar-only
window_margin_width 4
cursor_blink_interval 0
macos_option_as_alt both
macos_quit_when_last_window_closed no
macos_colorspace default
repaint_delay 8
input_delay 1
resize_draw_strategy blank
remember_window_size no
resize_debounce_time 0.001
allow_remote_control true

cursor_shape beam

# Disable kitty tabs/panes (managed by zellij)
clear_all_shortcuts no
map cmd+t no_op
map cmd+shift+t no_op
map cmd+enter no_op
map cmd+w no_op
map cmd+shift+w no_op
map cmd+shift+i no_op
map cmd+shift+l no_op

symbol_map U+E000-U+E00A,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+EA60-U+EBEB,U+ED00-U+EFC1,U+F000-U+F2FF,U+F300-U+F372,U+F400-U+F533,U+F0001-U+F1AF0 Hack Nerd Font Mono
symbol_map U+F8FF,U+100000-U+1018C7 SF Pro

# vim:ft=kitty

## name: catppuccin
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/mocha.conf

# The basic colors
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #CDD6F4

# Cursor colors
cursor                  #CDD6F4
cursor_text_color       #1E1E2E

# URL underline color when hovering with mouse
url_color               #94E2D5

# Kitty window border colors
active_border_color     #89B4FA
inactive_border_color   #313244
bell_border_color       #F9E2AF

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #1E1E2E
active_tab_background   #A6E3A1
inactive_tab_foreground #CDD6F4
inactive_tab_background #313244
tab_bar_background      #1E1E2E

# Colors for marks (marked text in the terminal)
mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

# The 16 terminal colors

# black
color0 #45475A
color8 #585B70

# red
color1 #F38BA8
color9 #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #BAC2DE
color15 #A6ADC8

# Current desktop theme from theme-switch (guix/scripts), overriding the colors
# above; kitty ignores it where it does not exist (macOS)
include ~/.config/theme/current/kitty.conf
