# Previews
set preview_images true
set preview_images_method kitty
set preview_files true
set preview_directories true
set collapse_preview false
set use_preview_script true

# Appearance
set draw_borders both
set column_ratios 1,3,4
set unicode_ellipsis true
set status_bar_on_top false
set tilde_in_titlebar true

# Behavior
set show_hidden true
set confirm_on_delete multiple
set sort natural
set sort_case_insensitive true
set sort_directories_first true

# Git integration
set vcs_aware true
set vcs_backend_git enabled

# Performance
set idle_delay 1500
set metadata_deep_search false
set automatically_count_files true

# Open files in emacs
map ee shell emacsclient -n %f
map ev shell emacsclient -n %f

# Trash instead of delete (uses macOS trash)
map dD shell trash %s
map dT shell trash %s

# Quick navigation
map gd cd ~/Downloads
map gs cd ~/Sync
map go cd ~/Sync/org
map gc cd ~/Code
map gD cd ~/Code/dotfiles
map gm cd ~/.mail

# Tabs
map <C-n> tab_new
map <C-w> tab_close
map <C-l> tab_move 1
map <C-h> tab_move -1

# File operations
map X shell extract %f
map Z shell tar -czf %f.tar.gz %s
map mk console mkdir%space
map mf console touch%space

# Fuzzy find with fzf
map <C-f> fzf_select
