# Emacs for text files
mime ^text, label editor = emacsclient -n -- "$@"
ext org|md|txt|conf|cfg|ini|json|yaml|yml|toml|hjson|nix|el|clj|sh|py|js|ts|rs|go|java|scala|sql|html|css, label editor = emacsclient -n -- "$@"

# Images
mime ^image, has open, flag f = open -- "$@"

# PDF
ext pdf, has open, flag f = open -- "$@"

# Video/Audio
mime ^video|^audio, has open, flag f = open -- "$@"

# Archives
ext tar|gz|bz2|xz|zip|rar|7z, has open = open -- "$@"

# Fallback to macOS open
label open, flag f = open -- "$@"
