scan_timeout = 500
add_newline = false

[character]
success_symbol = "[>](bold #A6E3A1)"
error_symbol = "[x](bold #F38BA8)"
vicmd_symbol = "[V](bold #89B4FA)"

[directory]
style = "bold #89B4FA"
read_only = " ro"
truncation_length = 3

[git_branch]
style = "bold #CBA6F7"

[git_status]
disabled = false
style = "#F9E2AF"

[git_commit]
commit_hash_length = 7
tag_disabled = false
only_detached = false

[git_metrics]
disabled = false
format = '([+$added]($added_style)) ([-$deleted]($deleted_style)) '
added_style = "#A6E3A1"
deleted_style = "#F38BA8"

[battery]
disabled = true

[python]
disabled = true

[cmake]
disabled = true

[package]
disabled = true

[nix_shell]
symbol = " "
style = "#94E2D5"
