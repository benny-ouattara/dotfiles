;; Omarchy-style bar for StumpWM: menu button and workspaces on the left, clock
;; in the center, tray and status icons on the right.
;;
;; Colors come from ~/.config/theme/current/polybar.ini, generated by
;; guix/scripts/theme-switch (StumpWM runs it with --refresh at startup).
;; StumpWM owns the bar: start-polybar in stumpwm/init.lisp launches it and
;; sends the workspaces module its content over IPC.

include-file = ~/.config/theme/current/polybar.ini
include-file = ~/.config/polybar/tokyo/modules.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30
background = ${color.bg}
foreground = ${color.fg}
line-size = 2
padding-left = 1
padding-right = 2
module-margin = 1
fixed-center = true

; Text font from the generated theme file, so theme-switch --font can change it
font-0 = ${font.text}
font-1 = "Symbols Nerd Font:size=12;3"

modules-left = menu workspaces
modules-center = date
modules-right = tray bluetooth network pulseaudio cpu

enable-ipc = true
cursor-click = pointer

[settings]
screenchange-reload = false
pseudo-transparency = false
