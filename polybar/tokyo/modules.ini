;; Modules for the Omarchy-style bar in config.ini. Colors are ${color.*} from
;; the generated theme file; icons are Symbols Nerd Font glyphs (font-1).
;; stumpish can't find StumpWM from polybar's processes, so clicks that need
;; StumpWM send its key bindings with xdotool instead.

[module/menu]
type = custom/text
format = 
format-foreground = ${color.blue}
format-padding = 1
; M-s-SPC runs guix/scripts/menu
click-left = xdotool key super+alt+space

[module/workspaces]
type = custom/ipc
; polybar-update-groups in stumpwm/init.lisp sends the workspace numbers
initial = 0

[module/date]
type = internal/date
interval = 5
; Click to switch between the two formats
time = %A %I:%M %p
time-alt = %A %d %B, week %V
label = %time%

[module/tray]
type = internal/tray
tray-spacing = 12px
tray-size = 55%

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/tokyo/bluetooth.sh
interval = 10
click-left = blueman-manager &
click-right = ~/.config/polybar/tokyo/bluetooth.sh toggle

[module/network]
type = internal/network
interface-type = wireless
interval = 5
format-connected = %{A1:kitty nmtui &:}<ramp-signal>%{A}
format-disconnected = %{A1:kitty nmtui &:}<label-disconnected>%{A}
label-disconnected = 󰤮
label-disconnected-foreground = ${color.muted}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

[module/pulseaudio]
type = internal/pulseaudio
; No sink set: follow the default sink, which s-a switches
use-ui-max = false
interval = 5
; Left click opens the mixer, right click mutes, scroll changes the volume
format-volume = %{A1:pavucontrol &:}<ramp-volume> <label-volume>%{A}
label-volume = %percentage%%
format-muted = %{A1:pavucontrol &:}<label-muted>%{A}
label-muted = 󰝟
label-muted-foreground = ${color.muted}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle

[module/cpu]
type = internal/cpu
interval = 5
label = %{A1:kitty btop &:}󰍛 %percentage%%%{A}

[module/recording]
type = custom/ipc
; Red dot while guix/scripts/record is recording; click to stop. The script
; re-runs this hook when a recording starts or stops.
hook-0 = ~/Code/dotfiles/guix/scripts/record indicator
initial = 1
format-foreground = ${color.red}

[module/dnd]
type = custom/ipc
; Bell-off icon while notifications are silenced (C-s-, or menu Toggle); click
; to resume
hook-0 = ~/.config/polybar/tokyo/dnd.sh
initial = 1
format-foreground = ${color.yellow}
